name: ModVoice
options:
  bundleIdPrefix: xyz.justsal
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  ModVoice:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Keyboard
        excludes: ["Info.plist"]
    dependencies:
      - target: Keyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.ModVoice
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Mod Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ModVoiceKey: ""
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  Keyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.ModVoice.Keyboard
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Mod Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ModVoiceKey: ""
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
  ModVoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ModVoice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.justsal.ModVoiceUITests
schemes:
  ModVoice:
    build:
      targets:
        ModVoice: all
    test:
      targets: [ModVoiceUITests]
